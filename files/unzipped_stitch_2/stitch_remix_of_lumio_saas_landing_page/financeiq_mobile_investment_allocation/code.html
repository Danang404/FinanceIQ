<style>
        /* Smooth scrolling and base setup */
        html { scroll-behavior: smooth; }
        body { 
            background: radial-gradient(circle at top right, #182230 0%, #10141a 60%);
            background-attachment: fixed;
        }
        /* Custom scrollbar for webkit (if needed on mobile browsers that show it) */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        
        /* Glassmorphism utility classes based on brand guidelines */
        .glass-card {
            background-color: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-input {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen relative pt-16 pb-24 antialiased">
<!-- TopAppBar (From JSON) -->
<header class="bg-surface/60 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-white/10 shadow-none flex justify-between items-center px-container-padding h-16 max-w-full">
<div class="flex items-center gap-2">
<!-- Back Action for contextual chat flow -->
<button class="text-on-surface-variant hover:bg-white/5 transition-colors active:scale-95 transition-transform p-1 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display text-display text-primary tracking-tight" style="font-size: 20px; line-height: 28px;">FinanceIQ</h1>
</div>
<div class="flex items-center gap-4">
<span class="text-on-surface-variant font-label-md text-label-md hidden sm:block">Mode: Pemula</span>
<div class="flex gap-2 text-on-surface-variant">
<button class="hover:bg-white/5 transition-colors active:scale-95 transition-transform p-1 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</button>
<button class="hover:bg-white/5 transition-colors active:scale-95 transition-transform p-1 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Chat Canvas -->
<main class="w-full max-w-md mx-auto p-container-padding flex flex-col gap-stack-gap-lg">
<!-- Date Header -->
<div class="w-full flex justify-center pt-4">
<span class="font-label-md text-label-md text-outline px-3 py-1 glass-card rounded-full">Hari Ini</span>
</div>
<!-- AI Assistant Group -->
<div class="flex flex-col gap-stack-gap-sm items-start w-full">
<!-- Avatar & Name -->
<div class="flex items-center gap-2 mb-1 px-1">
<div class="w-6 h-6 rounded-full bg-primary-container/20 flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Strategist AI</span>
</div>
<!-- Investment Allocation Card (Glassmorphism Bento Style) -->
<div class="glass-card rounded-xl p-glass-padding w-[90%] sm:w-80 rounded-tl-sm flex flex-col gap-stack-gap-md relative overflow-hidden group">
<!-- Subtle glow effect behind card -->
<div class="absolute -top-10 -right-10 w-24 h-24 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="flex justify-between items-start w-full">
<div class="flex flex-col">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Usulan Alokasi</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Total Investasi</p>
</div>
<div class="bg-primary/15 px-3 py-1 rounded-full border border-primary/20">
<span class="font-label-md text-label-md text-primary">Rp 1.000.000</span>
</div>
</div>
<div class="w-full h-px bg-white/10 my-1"></div>
<!-- Allocation Items -->
<div class="flex flex-col gap-4">
<!-- Item 1: RDPU -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(96,236,168,0.6)]"></div>
<span class="font-label-md text-label-md text-on-surface">RDPU</span>
<span class="font-label-md text-label-md text-outline-variant">(60%)</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface">Rp 600.000</span>
</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-1000 ease-out" style="width: 60%;"></div>
</div>
</div>
<!-- Item 2: Index Fund -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(255,185,82,0.6)]"></div>
<span class="font-label-md text-label-md text-on-surface">Index Fund</span>
<span class="font-label-md text-label-md text-outline-variant">(40%)</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface">Rp 400.000</span>
</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary rounded-full transition-all duration-1000 ease-out delay-300" style="width: 40%;"></div>
</div>
</div>
</div>
<button class="w-full mt-2 py-2.5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="font-label-md text-label-md text-on-surface">Terapkan Sekarang</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
<!-- AI Text Bubble -->
<div class="glass-card rounded-xl p-glass-padding w-[85%] rounded-tl-sm flex gap-3 items-start">
<div class="w-1.5 h-1.5 mt-2 rounded-full bg-primary shadow-[0_0_5px_rgba(96,236,168,0.8)] shrink-0"></div>
<p class="font-body-md text-body-md text-on-surface leading-relaxed">
                    Alokasi ini menjaga keamanan dana kamu sambil mulai mencicipi pertumbuhan pasar.
                </p>
</div>
<!-- Quick Reply Chips -->
<div class="flex gap-2 mt-2 overflow-x-auto pb-2 scrollbar-hide w-full pr-container-padding">
<button class="shrink-0 font-label-md text-label-md text-on-surface px-4 py-2 glass-card rounded-full hover:bg-white/10 transition-colors">
                    Terlihat bagus!
                </button>
<button class="shrink-0 font-label-md text-label-md text-on-surface px-4 py-2 glass-card rounded-full hover:bg-white/10 transition-colors">
                    Bisa ubah persentase?
                </button>
<button class="shrink-0 font-label-md text-label-md text-on-surface px-4 py-2 glass-card rounded-full hover:bg-white/10 transition-colors">
                    Apa itu RDPU?
                </button>
</div>
</div>
</main>
<!-- Bottom Chat Input (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl border-t border-white/5 p-container-padding pb-safe z-40">
<div class="max-w-md mx-auto flex items-center gap-3">
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 shrink-0">
<span class="material-symbols-outlined">add_circle</span>
</button>
<div class="flex-1 glass-input rounded-full px-4 py-3 flex items-center gap-2">
<input class="bg-transparent border-none outline-none text-on-surface font-body-md text-body-md w-full placeholder-outline-variant focus:ring-0 p-0" placeholder="Ketik pesan atau tanya AI..." type="text"/>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
</div>
<button class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary shrink-0 active:scale-95 transition-transform shadow-[0_4px_12px_rgba(96,236,168,0.2)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
<!-- Safe area padding for newer mobile devices -->
<div class="h-safe w-full"></div>
</div>
<!-- Inline script for safe area adjustment (basic simulation) -->
<script>
        // Simple script to ensure padding bottom is sufficient if virtual keyboard or safe areas are present
        document.documentElement.style.setProperty('--safe-area-inset-bottom', 'env(safe-area-inset-bottom)');
    </script>
<style>
        .pb-safe { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .h-safe { height: env(safe-area-inset-bottom); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
