services:
  - type: web
    name: financiiq-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FRONTEND_URL
        value: "https://your-vercel-app-url.vercel.app" # Ganti ini nanti di dashboard
      - key: NINEROUTER_URL
        value: "https://dashscope.aliyuncs.com/compatible-mode"
      - key: NINEROUTER_KEY
        value: "YOUR_QWEN_API_KEY_HERE"
